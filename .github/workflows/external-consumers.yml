name: External consumers

on:
  pull_request:
  workflow_dispatch:

jobs:
  maven-gradle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Verify external Maven consumer
        run: |
          for attempt in 1 2 3; do
            mvn --batch-mode --no-transfer-progress -DskipTests -pl lynxus-processor -am install \
              && mvn --batch-mode --no-transfer-progress -DskipTests -pl lynxus-spring-boot-starter -am install \
              && exit 0
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
          done
      - name: Verify external Gradle consumer
        run: gradle -p lynxus-examples/external-gradle-processor --no-daemon clean build

  spring-boot-maven:
    strategy:
      fail-fast: false
      matrix:
        spring-boot-version: ["3.1.5", "3.5.16", "4.1.1"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install Lynxus Processor
        run: mvn --batch-mode --no-transfer-progress -DskipTests -pl lynxus-processor -am install
      - name: Install Lynxus Starter
        run: mvn --batch-mode --no-transfer-progress -DskipTests -pl lynxus-spring-boot-starter -am install
      - name: Verify external Spring Boot consumer
        run: >-
          mvn --batch-mode --no-transfer-progress
          -f lynxus-examples/external-spring-boot-consumer/pom.xml
          -Dspring-boot.version=${{ matrix.spring-boot-version }} clean verify
      - name: Verify multi-DataSource Spring Boot example
        run: >-
          mvn --batch-mode --no-transfer-progress
          -f lynxus-examples/multi-datasource-spring-boot/pom.xml
          -Dspring-boot.version=${{ matrix.spring-boot-version }} clean verify

  spring-boot-runtime:
    strategy:
      fail-fast: false
      matrix:
        spring-boot-version: ["3.1.5", "3.5.16", "4.1.1"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install Lynxus Processor
        run: mvn --batch-mode --no-transfer-progress -DskipTests -pl lynxus-processor -am install
      - name: Verify Spring Boot Starter runtime
        run: >-
          mvn --batch-mode --no-transfer-progress
          -pl lynxus-spring-boot-starter -am
          -Dspring-boot.version=${{ matrix.spring-boot-version }} test

  spring-boot-4-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Install Lynxus Processor
        run: mvn --batch-mode --no-transfer-progress -DskipTests -pl lynxus-processor -am install
      - name: Install Lynxus Starter
        run: mvn --batch-mode --no-transfer-progress -DskipTests -pl lynxus-spring-boot-starter -am install
      - name: Run independent Spring Boot 4 E2E
        run: >-
          mvn --batch-mode --no-transfer-progress
          -f lynxus-examples/external-spring-boot-consumer/pom.xml
          -Dspring-boot.version=4.1.1
          -Dtest=ConsumerApplicationE2ETest
          clean verify
      - name: Run Spring Boot 4 multi-DataSource context test
        run: >-
          mvn --batch-mode --no-transfer-progress
          -f lynxus-examples/multi-datasource-spring-boot/pom.xml
          -Dspring-boot.version=4.1.1
          clean verify
